configuration:
  auto_discover_rooms:
    name: "Auto-discover rooms"
    description: "Automatically find rooms and their temperature/humidity sensors from Home Assistant's Area registry. Manual entries in 'rooms' / 'no_window_rooms' with a matching name always take precedence."
  area_discovery_interval_minutes:
    name: "Area discovery interval (minutes)"
    description: "How often the Area/Device/Entity registry is re-queried via the WebSocket API to pick up newly added rooms or sensors."
  no_window_areas:
    name: "No-window areas"
    description: "Names of Home Assistant Areas (e.g. 'Bad') that should be treated as mold-risk-only rooms instead of participating in the ventilation Güte score."
  outdoor_area_name:
    name: "Outdoor reference area"
    description: "Name of the Home Assistant Area (e.g. 'Außen') whose temperature/humidity sensors serve as the outdoor reference for all rooms. This area is never scored as a room itself and takes precedence over 'Outdoor weather entity' when its sensors are available."
  default_ideal_temp:
    name: "Default ideal temperature"
    description: "Ideal temperature (°C) applied to auto-discovered rooms that don't have a manual override."
  default_ideal_humidity_rel:
    name: "Default ideal relative humidity"
    description: "Ideal relative humidity (%) applied to auto-discovered rooms that don't have a manual override."
  default_weight_temp:
    name: "Default temperature weight"
    description: "Weight of the temperature term in the Güte score for auto-discovered rooms."
  default_weight_humidity:
    name: "Default humidity weight"
    description: "Weight of the humidity term in the Güte score for auto-discovered rooms."
  rooms:
    name: "Rooms (manual)"
    description: "Rooms with a window that participate in the ventilation quality score. A manual entry with a name matching a Home Assistant Area overrides the auto-discovered sensors/defaults for that room."
  no_window_rooms:
    name: "No-window rooms (manual)"
    description: "Rooms without a window (e.g. bathroom), handled separately: mold-risk assessment based on absolute humidity only, no ventilation recommendation."
  mold_risk_threshold:
    name: "Mold risk threshold"
    description: "Default absolute humidity (g/m³) above which a no-window room is flagged as mold risk. Can be overridden per room."
  mold_risk_hysteresis:
    name: "Mold risk hysteresis"
    description: "Default gap (g/m³) below the threshold required before the mold-risk flag clears again. Can be overridden per room."
  outdoor_weather_entity:
    name: "Outdoor weather entity (fallback)"
    description: "Weather entity providing current outdoor temperature/humidity attributes (e.g. weather.forecast_home). Only used as a fallback while the 'Outdoor reference area' has no working sensors."
  blend_steps:
    name: "Blend step size (%)"
    description: "Step size for the indoor/outdoor air blend simulation (0-100%). Must divide 100 evenly."
  delta_guete_threshold:
    name: "Delta-Güte threshold"
    description: "Minimum improvement in the Güte score (blend=100 vs blend=0) required to recommend airing out."
  stability_minutes:
    name: "Stability window (minutes)"
    description: "How long the positive delta must persist before a ventilation recommendation is triggered."
  poll_interval_seconds:
    name: "Poll interval (seconds)"
    description: "How often sensor states are read and the score is recalculated."
  notify_targets:
    name: "Notification targets"
    description: "Pairs of notify service and person entity; a notification is only sent while the person is home."
